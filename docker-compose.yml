# Local stack: API on :8000, built Flutter web app on :8080.
#   1) cd app && flutter build web --release --dart-define=API_BASE_URL=/      (once)
#   2) docker compose up --build
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      LOCAL_STORAGE_DIR: /srv/data/audio
      SQLITE_PATH: /srv/data/telugu_voice.db
    ports:
      - "8000:8000"
    volumes:
      - audio-data:/srv/data
      # Mount service-account JSON files read-only if you use them:
      # - ./secrets:/srv/secrets:ro
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports:
      - "8080:80"
    volumes:
      - ./app/build/web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  audio-data:
