name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the APK as a downloadable release

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # Generates android/ and fills in anything missing; existing files are kept.
      - run: flutter create --platforms=android,web --org com.teluguaivoice --project-name telugu_ai_voice .
      - run: flutter pub get
      # --allow-http: this test APK can talk to a PC server on home Wi-Fi.
      - run: dart run tool/setup_android.dart --allow-http
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: telugu-ai-voice-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish APK (download link on the Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk telugu-ai-voice.apk
          gh release create "build-${{ github.run_number }}" telugu-ai-voice.apk \
            --repo "${{ github.repository }}" \
            --title "Telugu AI Voice - test build ${{ github.run_number }}" \
            --notes "Android test build. On your phone: download telugu-ai-voice.apk, allow your browser to install unknown apps, then tap Install. If Android says the app can't be installed, uninstall the older build first."
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Web build check
        run: flutter build web --release
